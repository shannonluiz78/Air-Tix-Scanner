name: Price watch

on:
  schedule:
    # Every 6 hours. Edit the cron if you want it more/less frequent —
    # keep in mind Travelpayouts' rate limit and GitHub Actions minutes.
    - cron: "17 */6 * * *"
  issues:
    types: [opened, edited, reopened, labeled]
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

permissions:
  issues: write
  contents: read

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check watched routes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: python scripts/check_prices.py
